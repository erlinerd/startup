<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      Dev CSP (this source file). The `prod-csp` vite plugin (vite.config.ts)
      replaces this meta with a strict policy at build time — no unsafe-inline,
      connect-src narrowed (no `https:` wildcard) — because Electron's
      webRequest API never fires for the packaged file:// app. The dev policy
      keeps 'unsafe-inline' for Vite HMR. Keep the two in sync.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:* https:;"
    />
    <title>Startup</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
