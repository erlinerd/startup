# Keep dependencies fresh: pnpm + GitHub Actions.
version: 2
updates:
  - package-ecosystem: pnpm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      ai-sdk:
        patterns: ['ai', '@ai-sdk/*', '@assistant-ui/*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
