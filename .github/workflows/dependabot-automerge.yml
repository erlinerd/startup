name: Dependabot Auto-Merge

# Enables auto-merge (squash) on Dependabot PRs. The PR still has to satisfy
# every branch-protection requirement (CI green, reviews) before GitHub merges
# it — this workflow only flips the auto-merge switch, it never bypasses
# checks. Requires "Allow auto-merge" enabled in repo settings and a branch
# protection rule with required status checks on the `ci` job.
#
# Runs on pull_request_target because GitHub treats Dependabot PRs like fork
# PRs: a bare pull_request event gets a read-only token and no secrets. This
# is safe here because the job never executes code from the PR — it only calls
# `gh pr merge`.
on:
  pull_request_target:
    # opened only — `gh pr merge --auto` sticks across synchronize events, so
    # re-running on every PR update would just burn runner minutes.
    types: [opened]

permissions:
  contents: write # required to enable auto-merge
  pull-requests: write

jobs:
  dependabot-merge:
    name: enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
